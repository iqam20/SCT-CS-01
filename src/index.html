<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watches and Wonders Geneva Edition 2024 | Cartier®</title>
    <link href="./output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        .cartier-font {
            font-family: 'Playfair Display', serif;
        }
        .header-nav {
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        .hero-bg {
            background-color: #0f1012;
            color: white;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-white">

<header class="w-full bg-white z-50">
    <!-- Top Bar -->
    <div class="flex justify-between items-center px-4 md:px-8 py-4 border-b border-gray-100">
        <!-- Left Nav -->
        <div class="flex space-x-6 header-nav uppercase items-center text-xs">
            <div class="flex space-x-1 text-gray-500">
                <span class="cursor-pointer hover:text-black">FR</span>
                <span>/</span>
                <span class="border-b border-black font-semibold text-black cursor-pointer">EN</span>
            </div>
            <a href="#" class="hover:underline hidden sm:block text-gray-800">Contact Us</a>
            <a href="#" class="hover:underline hidden sm:block text-gray-800">Services</a>
        </div>

        <!-- Logo -->
        <div class="absolute left-1/2 transform -translate-x-1/2">
            <h1 class="cartier-font text-4xl md:text-5xl italic tracking-wider">Cartier</h1>
        </div>

        <!-- Right Nav -->
        <div class="flex space-x-4 md:space-x-6 items-center text-gray-800">
            <button aria-label="User account">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </button>
            <button aria-label="Wishlist">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </button>
            <button aria-label="Find a boutique" class="hidden sm:block">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <button aria-label="Shopping bag">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            </button>
        </div>
    </div>

    <!-- Main Navigation -->
    <nav class="hidden md:flex justify-center space-x-8 py-5 header-nav text-gray-800 uppercase font-medium tracking-widest relative border-b border-gray-100">
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1">Valentine's Day</a>
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1">High Jewellery</a>
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1">Jewellery</a>
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1">Watches</a>
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1">Bags and Accessories</a>
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1">Art of Living</a>
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1">Fragrances</a>
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1">The Maison</a>
        <a href="#" class="hover:text-black hover:border-b-2 hover:border-black transition-colors duration-200 pb-1 pr-4">News</a>
        <div class="border-l border-gray-300 pl-4 flex items-center h-full absolute right-8 top-1/2 transform -translate-y-1/2">
             <button aria-label="Search">
                <svg class="w-4 h-4 text-gray-600 hover:text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
        </div>
    </nav>
</header>

<main>
    <div class="hero-bg w-full h-[600px] flex flex-col justify-center items-center text-center px-4 relative">
        <div class="absolute inset-0 bg-[#161616]"></div>
        <div class="relative z-10 max-w-3xl">
             <h2 class="cartier-font text-5xl md:text-7xl mb-6 font-normal tracking-wide">Watches and Wonders</h2>
             <p class="text-sm md:text-base font-medium mb-10 tracking-[0.2em] uppercase text-gray-300">Geneva Edition 2024</p>
             <button class="border border-white bg-transparent hover:bg-white hover:text-black text-white px-8 py-3 uppercase tracking-[0.1em] text-xs font-semibold transition-colors duration-300">
                Explore the collection
             </button>
        </div>
    </div>

    <div class="h-96 bg-gray-50 flex items-center justify-center border-t border-gray-200">
        <p class="text-gray-400 italic cartier-font text-xl">The pinnacle of watchmaking excellence.</p>
    </div>
</main>

<footer class="bg-white border-t border-gray-200 py-12 text-center text-gray-500 text-xs tracking-widest uppercase">
    <p>© Cartier 2024</p>
</footer>

</body>
</html>
